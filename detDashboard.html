<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation Tracker - Dashboard</title>
    <link rel="stylesheet" href="src/css/detDashboard.css">
    <link rel="stylesheet" href="src/css/nav.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script type="module" src="src/js/auth.js"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <div id="dashboard-container">
        <header>
            <h1>Cadet Evaluation Dashboard</h1>
            <p>Wing-Level Performance Metrics</p>
        </header>
      
        <div class="main-content">
            <!-- Stats Cards (Top Row) -->
            <div class="stats-container">
                <div class="stat-card" id="total-cadets">
                    <h3>Total Cadets</h3>
                    <p>120</p>
                </div>
                <div class="stat-card" id="avg-pfa">
                    <h3>Average PFA Score</h3>
                    <p>93.5%</p>
                </div>
                <div class="stat-card" id="active-sobs">
                    <h3>Active SOBs</h3>
                    <p>87</p>
                </div>
                <div class="stat-card" id="form2-completion">
                    <h3>Form 2 Completion</h3>
                    <p>92%</p>
                </div>
            </div>

            <!-- Time Period Filter -->
            <div class="filter-container">
                <label for="time-period">Time Period:</label>
                <select id="time-period">
                    <option value="month">Last Month</option>
                    <option value="quarter">Last Quarter</option>
                    <option value="year" selected>Last Year</option>
                    <option value="all">All Time</option>
                </select>
            </div>

            <!-- Main Dashboard Content (Charts) -->
            <section class="overall-trends-dashboard">
                <!-- PFA Trends Section -->
                <div class="trend-card" id="pfa-section">
                    <h3>PFA Trends Overview</h3>
                    <div class="chart-container">
                        <canvas id="pfa-trend-chart"></canvas>
                    </div>
                </div>

                <!-- SOB Performance Trends -->
                <div class="trend-card" id="sob-section">
                    <h3>SOBs Performance Trends</h3>
                    <div class="chart-container">
                        <canvas id="sob-trend-chart"></canvas>
                    </div>
                </div>

                <!-- Attendance Trends -->
                <div class="trend-card" id="attendance-section">
                    <h3>Attendance Trends</h3>
                    <div class="chart-container">
                        <canvas id="attendance-trend-chart"></canvas>
                    </div>
                </div>

                <!-- Form 2 Submission Overview -->
                <div class="trend-card" id="form2-section">
                    <h3>Form 2 Submission Overview</h3>
                    <div class="chart-container">
                        <canvas id="form2-trend-chart"></canvas>
                    </div>
                </div>

                <!-- Competency Growth Visualization -->
                <!-- <div class="trend-card" id="competency-section">
                    <h3>Competency Growth Visualization</h3>
                    <div class="chart-container">
                        <canvas id="competency-trend-chart"></canvas>
                    </div>
                </div> -->
            </section>
        </div>
    </div>

    <!-- Firebase Config -->
    <script src="src/js/firebase-config.js"></script>
    
    <!-- Dashboard Scripts -->
    <script src="src/js/dashboard.js"></script>
    
</body>
</html>
