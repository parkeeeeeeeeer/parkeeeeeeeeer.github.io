<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTC Detachment Dashboard</title>
    <link rel="stylesheet" href="src/css/detDashboard.css">
    <link rel="stylesheet" href="src/css/nav.css">
    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
    <!-- Navigation component will be loaded via JavaScript -->
    <div id="navbar-container"></div>

    <main class="dashboard-container">
        <h1 id="dashboard-title">Wing-Level Performance Metrics</h1>

        <!-- Message container for notifications -->
        <div id="message-container"></div>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="hidden">
            <div class="loading-spinner"></div>
            <p>Loading data...</p>
        </div>

        <!-- Dashboard Controls -->
        <div class="dashboard-controls">
            <div class="filter-container">
                <!-- Cadet selector will be added here for authorized roles -->
                <div class="time-filter">
                    <label for="time-period">Time Period:</label>
                    <select id="time-period">
                        <option value="week">Past Week</option>
                        <option value="month" selected>Past Month</option>
                        <option value="quarter">Past Quarter</option>
                        <option value="year">Past Year</option>
                    </select>
                </div>
                <button id="export-dashboard" class="button-primary">Export Data</button>
            </div>
        </div>

        <!-- High-level Stats Cards -->
        <div class="stats-cards">
            <div class="stat-card" id="total-cadets">
                <h3>Total Cadets</h3>
                <p>--</p>
            </div>
            <div class="stat-card" id="avg-pfa">
                <h3>Average PFA Score</h3>
                <p>--</p>
                <div class="standards-indicator">-- Pass Rate</div>
            </div>
            <div class="stat-card" id="active-sobs">
                <h3>Active SOBs</h3>
                <p>--</p>
            </div>
            <div class="stat-card" id="form2-completion">
                <h3>Form 2 Completion</h3>
                <p>--</p>
            </div>
        </div>

        <!-- Overall Trends Dashboard with Sliding Cards -->
        <section class="dashboard-section">
            <h2>Performance Trends</h2>
            <div class="overall-trends-dashboard">
                <!-- PFA Trend Card -->
                <div class="trend-card">
                    <div class="chart-container">
                        <div class="loading-spinner hidden"></div>
                        <canvas id="pfa-trend-chart"></canvas>
                    </div>
                </div>

                <!-- PFA Pass Rate Card -->
                <div class="trend-card">
                    <div class="chart-container">
                        <div class="loading-spinner hidden"></div>
                        <canvas id="pfa-pass-chart"></canvas>
                    </div>
                </div>

                <!-- SOB Trend Card -->
                <div class="trend-card">
                    <div class="chart-container">
                        <div class="loading-spinner hidden"></div>
                        <canvas id="sob-trend-chart"></canvas>
                    </div>
                </div>

                <!-- SOB Standards Card -->
                <div class="trend-card">
                    <div class="chart-container">
                        <div class="loading-spinner hidden"></div>
                        <canvas id="sob-standards-chart"></canvas>
                    </div>
                </div>

                <!-- Attendance Trend Card -->
                <div class="trend-card">
                    <div class="chart-container">
                        <div class="loading-spinner hidden"></div>
                        <canvas id="attendance-trend-chart"></canvas>
                    </div>
                </div>

                <!-- Form 2 Trend Card -->
                <div class="trend-card">
                    <div class="chart-container">
                        <div class="loading-spinner hidden"></div>
                        <canvas id="form2-trend-chart"></canvas>
                    </div>
                </div>

                <!-- Navigation arrows and indicators will be added by JavaScript -->
            </div>
        </section>

        <!-- Footer with credits and version info -->
        <footer class="dashboard-footer">
            <p>ROTC Detachment Performance Dashboard v1.0</p>
            <p>Data last updated: <span id="last-update-time">--</span></p>
        </footer>
    </main>

    <!-- Firebase scripts -->
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js"></script>
    
    <!-- Application scripts -->
    <script type="module" src="src/js/auth.js" defer></script>
    <script type="module" src="src/js/dashboard.js" defer></script>
</body>
</html>
